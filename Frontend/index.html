<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Library Management System</h1>
    </header>

    <nav>
        <button onclick="showSection('add')">Add Book</button>
        <button onclick="showSection('view')">View Books</button>
        <button onclick="showSection('update')">Update Book</button>
        <button onclick="showSection('delete')">Delete Book</button>
    </nav>

    <main>

        <!-- ADD BOOK SECTION -->
        <section id="add" class="section active">
            <h2>Add New Book</h2>
            <form id="addForm">
                <input type="text" id="addBookName" placeholder="Book Name" required>
                <input type="text" id="addAuthor" placeholder="Author" required>
                <input type="number" id="addQuantity" placeholder="Quantity" required>
                <button type="submit">Add Book</button>
            </form>
        </section>

        <!-- VIEW BOOKS SECTION -->
        <section id="view" class="section">
            <h2>All Books</h2>
            <table id="booksTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Quantity</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Yahan JS se rows aayenge -->
                </tbody>
            </table>
        </section>

        <!-- UPDATE BOOK SECTION -->
        <section id="update" class="section">
            <h2>Update Book</h2>
            <form id="updateForm">
                <input type="number" id="updateId" placeholder="Book ID" required>
                <input type="text" id="updateBookName" placeholder="New Book Name" required>
                <input type="text" id="updateAuthor" placeholder="New Author" required>
                <input type="number" id="updateQuantity" placeholder="New Quantity" required>
                <button type="submit">Update Book</button>
            </form>
        </section>

        <!-- DELETE BOOK SECTION -->
        <section id="delete" class="section">
            <h2>Delete Book</h2>
            <form id="deleteForm">
                <input type="number" id="deleteId" placeholder="Book ID" required>
                <button type="submit">Delete Book</button>
            </form>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
